<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Admin Dashboard - Complaints</title>

  <style>
    body { font-family: Arial; background: #f4f6f8; margin: 0; }

    .topbar {
      background: #1f6feb; color: white;
      padding: 14px; font-size: 20px; font-weight: bold;
      display: flex; justify-content: space-between; align-items: center;
    }

    .btn {
      padding: 8px 12px;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      font-size: 14px;
    }

    .btn-light {
      background: #fff;
      color: #1f6feb;
    }

    .btn-status {
      margin-right: 4px;
      margin-bottom: 4px;
      font-size: 12px;
      padding: 4px 8px;
      cursor: pointer;
    }

    .container {
      padding: 20px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: #fff;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 4px 10px rgba(0,0,0,0.06);
    }

    th, td {
      padding: 10px 12px;
      border-bottom: 1px solid #eee;
      text-align: left;
      vertical-align: top;
      font-size: 14px;
    }

    th {
      background: #e7efff;
      color: #1f6feb;
      font-weight: bold;
    }

    tr:last-child td {
      border-bottom: none;
    }

    .status-pill {
      display: inline-block;
      padding: 4px 8px;
      border-radius: 999px;
      font-size: 12px;
      text-transform: capitalize;
    }

    .status-pending {
      background: #ffecec;
      color: #d00;
    }

    .status-progress {
      background: #fff4d5;
      color: #b36b00;
    }

    .status-resolved {
      background: #e6ffea;
      color: #0a8a2a;
    }

    .small {
      font-size: 12px;
      color: #666;
    }

    .thumb {
      max-width: 80px;
      max-height: 80px;
      border-radius: 6px;
      object-fit: cover;
      cursor: pointer;
      border: 1px solid #ddd;
    }
  </style>
</head>
<body>

  <div class="topbar">
    <span>Admin Dashboard — Complaints</span>
    <div>
      <button class="btn btn-light" onclick="goHome()">Home</button>
      <button class="btn btn-light" onclick="adminLogout()" style="margin-left:8px;">
        Logout Admin
      </button>
    </div>
  </div>

  <div class="container">
    <table id="complaintsTable">
      <thead>
        <tr>
          <th>Reporter</th>
          <th>Category</th>
          <th>Location</th>
          <th>Description</th>
          <th>Photo</th>
          <th>Status</th>
          <th>Reported On</th>
          <th>Change Status</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <!-- 🔍 Image Zoom Modal -->
  <div id="imgModal" style="
    display:none; 
    position:fixed; 
    top:0; left:0; width:100%; height:100%;
    background:rgba(0,0,0,0.8); 
    justify-content:center; 
    align-items:center;
    z-index:9999;">
    <img id="modalImg" style="
      max-width:90%;
      max-height:90%;
      border-radius:10px;
      border:2px solid #fff;">
  </div>

  <script>
    const adminToken = localStorage.getItem('admin_token');
    if (!adminToken) {
      window.location.href = 'admin-login.html';
    }

    function goHome() {
      window.location.href = 'home.html';
    }

    function adminLogout() {
      localStorage.removeItem('admin_token');
      window.location.href = 'admin-login.html';
    }

    function statusClass(status) {
      if (status === 'Resolved') return 'status-resolved';
      if (status === 'In Progress') return 'status-progress';
      return 'status-pending';
    }

    function buildStatusButtons(id, status) {
      // Pending -> show In Progress + Resolved
      // In Progress -> show Resolved only
      // Resolved -> no buttons
      if (status === 'Pending') {
        return `
          <button class="btn btn-status" onclick="updateStatus('${id}', 'In Progress')">In Progress</button>
          <button class="btn btn-status" onclick="updateStatus('${id}', 'Resolved')">Resolved</button>
        `;
      }
      if (status === 'In Progress') {
        return `
          <button class="btn btn-status" onclick="updateStatus('${id}', 'Resolved')">Resolved</button>
        `;
      }
      return '';
    }

    async function loadComplaints() {
      try {
        const res = await fetch('http://localhost:3000/api/complaints', {
          headers: {
            'Authorization': 'Bearer ' + adminToken
          }
        });

        const complaints = await res.json();
        const tbody = document.querySelector('#complaintsTable tbody');
        tbody.innerHTML = '';

        complaints.forEach(c => {
          const tr = document.createElement('tr');

          const created = c.createdAt
            ? new Date(c.createdAt).toLocaleString()
            : '-';

          const photoCell = c.photoPath
            ? `<img src="http://localhost:3000${c.photoPath}" class="thumb zoomable-img">`
            : '<span class="small">No photo</span>';

          tr.innerHTML = `
            <td>
              ${c.reporterName || 'Unknown'}<br>
              <span class="small">${c._id}</span>
            </td>
            <td>${c.category}</td>
            <td>${c.location || '-'}</td>
            <td>${c.text}</td>
            <td>${photoCell}</td>
            <td>
              <span class="status-pill ${statusClass(c.status)}">
                ${c.status}
              </span>
            </td>
            <td>${created}</td>
            <td>
              ${buildStatusButtons(c._id, c.status)}
            </td>
          `;

          tbody.appendChild(tr);
        });

      } catch (err) {
        console.error('Error loading complaints', err);
        alert('Error loading complaints');
      }
    }

    async function updateStatus(id, newStatus) {
      try {
        const res = await fetch(`http://localhost:3000/api/complaints/${id}/status`, {
          method: 'PATCH',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': 'Bearer ' + adminToken
          },
          body: JSON.stringify({ status: newStatus }),
        });

        const data = await res.json();
        if (!res.ok) {
          throw new Error(data.message || 'Failed to update status');
        }

        loadComplaints();
      } catch (err) {
        console.error('Error updating status', err);
        alert(err.message || 'Error updating status');
      }
    }

    // 🖼️ Image zoom logic
    document.addEventListener('click', function(e) {
      if (e.target.classList.contains('zoomable-img')) {
        const modal = document.getElementById('imgModal');
        const modalImg = document.getElementById('modalImg');
        modalImg.src = e.target.src;
        modal.style.display = 'flex';
      }
    });

    document.getElementById('imgModal').addEventListener('click', () => {
      document.getElementById('imgModal').style.display = 'none';
    });

    loadComplaints();
  </script>

</body>
</html>
