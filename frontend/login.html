<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Login - Digital Complaint Box</title>

  <link rel="icon" type="image/png" href="favicon.png">

  <style>
    body {
      font-family: Arial;
      background: #f4f6f8;
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .card {
      background: #fff;
      padding: 28px;
      width: 360px;
      border-radius: 12px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.08);
    }
    h1 { text-align: center; color: #1f6feb; margin-bottom: 20px; }
    label {
      display: block;
      margin-top: 10px;
      font-size: 14px;
    }
    input {
      width: 100%;
      padding: 10px;
      margin-top: 6px;
      border-radius: 8px;
      border: 1px solid #ccc;
      font-size: 15px;
    }
    button {
      width: 100%;
      padding: 12px;
      background: #1f6feb;
      color: white;
      border: none;
      font-size: 16px;
      border-radius: 8px;
      cursor: pointer;
      margin-top: 16px;
    }
    button:hover { background: #155cc4; }
    .muted {
      font-size: 14px;
      text-align: center;
      margin-top: 12px;
    }
    .error {
      color: red;
      font-size: 14px;
      margin-top: 10px;
      text-align: center;
      display: none;
    }
    .success {
      color: green;
      font-size: 14px;
      margin-top: 10px;
      text-align: center;
      display: none;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>Sign In</h1>

    <form id="loginForm">
      <label for="email">Email</label>
      <input id="email" type="email" required />

      <label for="password">Password</label>
      <input id="password" type="password" required />

      <button type="submit">Login</button>
    </form>

    <div id="errorBox" class="error"></div>
    <div id="successBox" class="success"></div>

    <p class="muted">
      Don’t have an account? <a href="register.html">Create one</a>
    </p>
  </main>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const form = document.getElementById('loginForm');
      const errorBox = document.getElementById('errorBox');
      const successBox = document.getElementById('successBox');

      form.addEventListener('submit', async (e) => {
        e.preventDefault();

        errorBox.style.display = 'none';
        successBox.style.display = 'none';

        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value.trim();

        if (!email || !password) {
          errorBox.innerText = 'Email and password are required.';
          errorBox.style.display = 'block';
          return;
        }

        try {
          const res = await fetch('http://localhost:3000/api/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, password }),
          });

          // Try to parse JSON safely
          let data = {};
          try {
            data = await res.json();
          } catch (e) {
            data = {};
          }

          if (!res.ok) {
            throw new Error(data.message || 'Login failed');
          }

          // If your backend returns a token, you can store it:
          if (data.token) {
            localStorage.setItem('token', data.token);
          }

          successBox.innerText = 'Login successful! Redirecting...';
          successBox.style.display = 'block';

          // Redirect to home/dashboard after login
          setTimeout(() => {
            window.location.href = 'home.html'; // change if your main page is different
          }, 1200);

        } catch (err) {
          errorBox.innerText = err.message || 'Login failed';
          errorBox.style.display = 'block';
        }
      });
    });
  </script>

</body>
</html>
