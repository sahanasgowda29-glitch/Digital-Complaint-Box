<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Write Complaint</title>

  <style>
    body { font-family: Arial; background: #f4f6f8; margin: 0; }

    .topbar {
      background: #1f6feb; color: white;
      padding: 14px; font-size: 20px; font-weight: bold;
      display: flex; justify-content: space-between; align-items: center;
    }

    .container {
      padding: 20px;
    }

    .card {
      background: #fff; padding: 20px; border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.08);
    }

    label {
      display: block;
      margin-top: 10px;
      font-size: 14px;
    }

    input[type="text"] {
      width: 100%;
      padding: 10px;
      margin-top: 6px;
      border-radius: 8px;
      border: 1px solid #ccc;
      font-size: 15px;
      box-sizing: border-box;
    }

    textarea {
      width: 100%; height: 160px;
      padding: 10px; border: 1px solid #ccc;
      border-radius: 8px; font-size: 15px;
      resize: vertical;
      box-sizing: border-box;
    }

    .button {
      background: #1f6feb; color: white;
      padding: 12px 16px; border: none;
      border-radius: 8px; cursor: pointer;
      margin-top: 12px;
      font-size: 15px;
    }

    .photo-box {
      margin-top: 12px;
      border: 1px dashed #999; padding: 20px;
      border-radius: 8px; text-align: center;
      background: #fafafa;
    }

    #status {
      margin-top: 10px;
      font-size: 14px;
    }

    #status.error { color: red; }
    #status.success { color: green; }
  </style>
</head>

<body>

  <div class="topbar">
    <span>File a Complaint</span>
    <button class="button" style="background:#d00" onclick="goBack()">Back</button>
  </div>

  <div class="container">
    <div class="card">
      <h3 id="catTitle"></h3>

      <label for="locationInput">Location / Area</label>
      <input id="locationInput" type="text" placeholder="e.g., 2nd Cross, Ward 5" />

      <label for="complaintText">Complaint Details</label>
      <textarea id="complaintText" placeholder="Describe the issue..."></textarea>

      <div class="photo-box">
        <label for="photoInput" style="display:block; margin-bottom:6px;">
          Attach a photo (optional)
        </label>
        <input type="file" id="photoInput" accept="image/*">
        <div id="preview" style="margin-top:10px; color:#555;">
          No photo selected
        </div>
      </div>

      <button class="button" id="submitBtn">Submit Complaint</button>
      <div id="status"></div>
    </div>
  </div>

  <script>
    function goBack() {
      window.location.href = 'home.html';
    }

    // Show selected category
    const cat = localStorage.getItem('selected_category') || 'Complaint';
    document.getElementById('catTitle').innerText = cat;

    const photoInput = document.getElementById('photoInput');
    const preview = document.getElementById('preview');
    const statusEl = document.getElementById('status');

    photoInput.addEventListener('change', () => {
      if (photoInput.files && photoInput.files[0]) {
        preview.innerText = 'Selected: ' + photoInput.files[0].name;
      } else {
        preview.innerText = 'No photo selected';
      }
    });

    document.getElementById('submitBtn').addEventListener('click', async () => {
      statusEl.textContent = '';
      statusEl.className = '';

      const text = document.getElementById('complaintText').value.trim();
      const location = document.getElementById('locationInput').value.trim();

      if (!location || !text) {
        statusEl.textContent = 'Please enter location and complaint details.';
        statusEl.className = 'error';
        return;
      }

      const token = localStorage.getItem('token');
      if (!token) {
        statusEl.textContent = 'You must be logged in.';
        statusEl.className = 'error';
        return;
      }

      const reporterName = localStorage.getItem('dc_username') || 'Anonymous';

      const formData = new FormData();
      formData.append('category', cat);
      formData.append('text', text);
      formData.append('location', location);
      formData.append('reporterName', reporterName);

      if (photoInput.files && photoInput.files[0]) {
        formData.append('photo', photoInput.files[0]);
      }

      try {
        const res = await fetch('http://localhost:3000/api/complaints', {
          method: 'POST',
          headers: {
            'Authorization': 'Bearer ' + token
            // Do NOT set Content-Type for FormData
          },
          body: formData,
        });

        let data = {};
        try {
          data = await res.json();
        } catch (e) {
          data = {};
        }

        if (!res.ok) {
          throw new Error(data.message || 'Failed to submit complaint');
        }

        statusEl.textContent = 'Complaint submitted successfully!';
        statusEl.className = 'success';

        document.getElementById('complaintText').value = '';
        document.getElementById('locationInput').value = '';
        photoInput.value = '';
        preview.innerText = 'No photo selected';

      } catch (err) {
        console.error(err);
        statusEl.textContent = err.message || 'Error submitting complaint';
        statusEl.className = 'error';
      }
    });
  </script>
</body>
</html>
